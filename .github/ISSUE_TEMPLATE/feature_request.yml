name: Feature Request
description: Suggest an improvement to the website
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Changes to the venue's business information (opening hours, prices, events, menu) need confirmation from the venue owner before they go on the site.

  - type: textarea
    id: what
    attributes:
      label: What would you like?
      description: Describe the change or the new feature.
      placeholder: Show the opening hours on the menu page.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What problem does it solve, and for whom (guests, the venue, search engines)?
      placeholder: Guests looking at the menu cannot see whether the venue is open tonight.
    validations:
      required: true

  - type: input
    id: pages
    attributes:
      label: Page or pages
      description: Which page or pages it affects, if any.
      placeholder: https://thehot.vn/menu

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Content
        - Design and layout
        - Menu
        - Events
        - Booking and contact
        - Search and social sharing
        - Performance
        - Accessibility
        - Documentation
        - Other

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Examples, mockups, screenshots or links.

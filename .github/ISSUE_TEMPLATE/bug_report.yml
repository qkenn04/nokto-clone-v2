name: Bug Report
description: Something on https://thehot.vn looks wrong, is broken or does not work
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with the website. This form is for the site itself: layout, broken links or buttons, wrong text, slow or missing pages.

        - For bookings or questions about the venue, use the contact options on https://thehot.vn.
        - For a security problem, do not use this form. Follow [SECURITY.md](https://github.com/qkenn04/thehot/blob/main/SECURITY.md) instead.

  - type: input
    id: page-url
    attributes:
      label: Page URL
      description: The full address of the page where you saw the problem.
      placeholder: https://thehot.vn/menu
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What is wrong?
      description: A clear description of the problem.
      placeholder: The menu button does nothing when I tap it.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: What did you do before the problem appeared?
      placeholder: |
        1. Open https://thehot.vn/menu on a phone
        2. Scroll to the bottom
        3. Tap "Đặt bàn"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead?

  - type: input
    id: device
    attributes:
      label: Device and browser
      description: Device, operating system and browser, with versions if you know them.
      placeholder: iPhone 13, iOS 18, Safari / Windows 11, Chrome
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: Drag and drop images or a short video here. Hide any personal information first.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that helps, for example whether it happens every time or only sometimes.
